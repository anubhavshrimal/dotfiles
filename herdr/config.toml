onboarding = false
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Match ~/.tmux.conf bindings.
# Defaults already matching tmux (pane nav h/j/k/l, prefix+minus split down,
# new tab c, close x, zoom z, tabs 1..9) are left alone.
[keys]
prefix = "ctrl+a"

# tmux: bind | split-window -h  (side-by-side)
# "|" is shift+backslash and can be eaten by the terminal, so keep prefix+v as a fallback.
split_vertical = ["prefix+|", "prefix+v"]

# New tab on prefix+t; keep the prefix+c default as a fallback.
new_tab = ["prefix+t", "prefix+c"]

# Agent navigation. Unbound by default in herdr.
# Order follows the sidebar (agent_panel_sort = "spaces").
previous_agent = "prefix+["
next_agent = "prefix+]"

# tmux: prefix+d detaches. Keep herdr's prefix+q default as a fallback.
# Note: prefix+shift+d is close_workspace, so a stray shift is destructive.
detach = ["prefix+d", "prefix+q"]

# reload_config on prefix+shift+c ("config"); resize_mode keeps a shift+r chord.
# Both move off prefix+r, which the reviewr toggle claims below.
reload_config = "prefix+shift+c"
resize_mode = "prefix+shift+r"

[experimental]
pane_history = true

# reviewr code-review sidebar: show/hide on prefix+r (mnemonic: "review").
# [[keys.command]] can't shadow a native action, so prefix+r had to be freed above.
[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr plugin action invoke toggle --plugin persiyanov.reviewr"

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "terminal"
